name: globeporter
description: "Project by GlobePorter"
publish_to: "none"

version: 1.0.0

environment:
  sdk: ">=3.2.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  core:
    path: ./core
  
  datasource:
    path: ./datasource
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  http: ^1.4.0
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  logger: ^2.6.0
  country_picker: ^2.0.27
  country_code_picker: ^3.3.0
  google_maps_flutter: ^2.12.3
  location: ^8.0.1
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  flutter_polyline_points: ^2.1.0
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^19.3.0
  flutter_native_splash: ^2.4.6
  flutter_svg: 
  flutter_secure_storage: ^9.2.2
  go_router: 
  device_preview: ^1.2.0
  intl: 
  image_picker: ^1.1.2
  uuid: ^4.5.1
  camera: ^0.11.2
  dropdown_button2: ^2.3.9
  google_sign_in: ^7.1.1
  flutter_facebook_auth: ^7.1.2

flutter_native_splash:
  color: "#51B848"
  image: assets/images/logo_large.png
  android_gravity: center
  ios_content_mode: scaleAspectFit
  fullscreen: true
  android: true
  ios: true
  color_dark: "#51B848"
  image_dark: assets/images/logo_large.png
  android_12:
    image: assets/images/app_icon.png
    icon_background_color: "#51B848"
    fullscreen: true
    image_dark: assets/images/app_icon.png
    icon_background_color_dark: "#51B848"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Light.ttf
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
